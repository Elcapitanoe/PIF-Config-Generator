[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pif-config-generator"
version = "1.0.0"
description = "Automated pipeline for extracting and generating Play Integrity Fix (PIF) device profiles from upstream build properties."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "PyGithub>=2.1.1",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pif-gen = "pif_generator.cli:main"
